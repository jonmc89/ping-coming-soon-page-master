<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <title>Frontend Mentor | Ping coming soon page</title>
    <script
      src="https://kit.fontawesome.com/d4691f768e.js"
      crossorigin="anonymous"
    ></script>
    <script src="./script.js" defer></script>
  </head>
  <body>
    <main>
      <img class="logo" src="./images/logo.svg" alt="ping logo" />
      <div class="header-text">
        <h1>We are launching <span class="soon">soon!</span></h1>
        <p>Subscribe and get notified</p>
      </div>
      <form id="form">
        <div class="email-input-wrapper">
          <input
            id="email"
            class="email-input"
            placeholder="Your email addess..."
            aria-label="email"
            name="email"
          />
          <span
            id="errorMessage"
            class="error-message"
            aria-describedby="email"
          ></span>
        </div>
        <button type="submit">Notify Me</button>
      </form>
      <img
        class="illustration-dashboard-image"
        src="./images/illustration-dashboard.png"
        alt="A Slack analytics dashboard with four chart cards and a left sidebar of menu placeholders. A Slack logo appears at the bottom of the sidebar. The clean, bright interface displays no readable chart labels or data and has a calm, orderly tone."
      />
    </main>
    <footer>
      <div class="socials-container">
        <a href="#" aria-label="Facebook"
          ><i class="fa-brands fa-facebook-f"></i
        ></a>
        <a href="#" aria-label="Twitter"
          ><i class="fa-brands fa-twitter"></i
        ></a>
        <a href="#" aria-label="Instagram"
          ><i class="fa-brands fa-instagram"></i
        ></a>
      </div>
      <p>© Copyright Ping. All rights reserved.</p>
    </footer>
  </body>
</html>
